version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=mysecretkey
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=1234
      - DB_NAME=postgres
    depends_on:
      db:
        condition: service_healthy  # ← รอให้ db พร้อมก่อน

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]  # ← เช็คว่า db พร้อมไหม
      interval: 5s   # เช็คทุก 5 วินาที
      timeout: 5s    # รอ 5 วินาที
      retries: 5     # ลองซ้ำ 5 ครั้ง

volumes:
  pgdata: